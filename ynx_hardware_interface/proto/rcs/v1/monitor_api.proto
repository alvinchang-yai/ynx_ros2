enum TorqueUnitType {
    TORQUE_UNIT_TYPE_UNSPECIFIED = 0;
    TORQUE_UNIT_TYPE_PERCENTAGE = 1;         // [%]
    TORQUE_UNIT_TYPE_NEWTON_METER = 2;       // [Nm]
}

message GetFeedbackTorqueRequest {
    int32 group_no = 1;
    TorqueUnitType unit_type = 2;
}

message GetFeedbackTorqueResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_GROUP_DOES_NOT_EXIST = 3;
        STATUS_UNIT_TYPE_OUTRANGE = 4;
    }
    Status status = 2;

    repeated double trq = 3;
}

