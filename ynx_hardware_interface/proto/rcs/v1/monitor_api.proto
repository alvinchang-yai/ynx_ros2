syntax = "proto3";

package rcs.v1;

import "rcs/v1/timestamp.proto";
import "rcs/v1/position_types.proto";

/**
 * `RealtimeMonitor` service provides a way to monitor values which is send from Robot Controller.
 * Command : Input data to the motor
 * Feedback : Output data from the motor
 *
 * [ERRORS]
 * - See each response message definitions for RPC specific errors.
 */
service RealtimeMonitorService {
    // Get current command pulse value by streaming.
    rpc GetPulseStream(GetPulseStreamRequest) returns (stream GetPulseStreamResponse);
    // Get current command pulse value once.
    rpc GetPulse(GetPulseRequest) returns (GetPulseResponse);
    // Get current command axes position(degree/mm) by streaming.
    rpc GetAxesPosStream(GetAxesPosStreamRequest) returns (stream GetAxesPosStreamResponse);
    // Get current command axes position(degree/mm) once.
    rpc GetAxesPos(GetAxesPosRequest) returns (GetAxesPosResponse);
    // Get current command cartesian position value by streaming.
    rpc GetCartesianPosStream(GetCartesianPosStreamRequest) returns (stream GetCartesianPosStreamResponse);
    // Get current command cartesian position value once.
    rpc GetCartesianPos(GetCartesianPosRequest) returns (GetCartesianPosResponse);
    // Get current feedback pulse value by streaming.
    rpc GetFeedbackPulseStream(GetFeedbackPulseStreamRequest) returns (stream GetFeedbackPulseStreamResponse);
    // Get current feedback pulse value once.
    rpc GetFeedbackPulse(GetFeedbackPulseRequest) returns (GetFeedbackPulseResponse);
    // Get current feedback axes position(degree/mm) by streaming.
    rpc GetFeedbackAxesPosStream(GetFeedbackAxesPosStreamRequest) returns (stream GetFeedbackAxesPosStreamResponse);
    // Get current feedback axes position(degree/mm) once.
    rpc GetFeedbackAxesPos(GetFeedbackAxesPosRequest) returns (GetFeedbackAxesPosResponse);
    // Get current feedback cartesian position value by streaming.
    rpc GetFeedbackCartesianPosStream(GetFeedbackCartesianPosStreamRequest) returns (stream GetFeedbackCartesianPosStreamResponse);
    // Get current feedback cartesian position value once.
    rpc GetFeedbackCartesianPos(GetFeedbackCartesianPosRequest) returns (GetFeedbackCartesianPosResponse);
    // Get current feedback torque by streaming.
    rpc GetFeedbackTorqueStream(GetFeedbackTorqueStreamRequest) returns (stream GetFeedbackTorqueStreamResponse);
    // Get current feedback torque once.
    rpc GetFeedbackTorque(GetFeedbackTorqueRequest) returns (GetFeedbackTorqueResponse);
}

message GetPulseRequest {
    int32 group_no = 1;
}

message GetPulseResponse {
    Timestamp timestamp = 1;
    PulsePos pulse_pos = 2;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_GROUP_DOES_NOT_EXIST = 3;
    }
    Status status = 3;
}

message GetPulseStreamRequest {
    int32 group_no = 1;

    // The rate decides the response cycle. The unit is Hz and the max is 250 Hz.
    // The specified rate is rounded depending on the control period of the robot controller.
    float rate = 2;
}

message GetPulseStreamResponse {
    Timestamp timestamp = 1;
    PulsePos pulse_pos = 2;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_GROUP_DOES_NOT_EXIST = 3;
    }
    Status status = 3;
}

message GetAxesPosRequest {
    int32 group_no = 1;
}

message GetAxesPosResponse {
    Timestamp timestamp = 1;
    AxesPos axes_pos = 2;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_GROUP_DOES_NOT_EXIST = 3;
    }
    Status status = 3;
}

message GetAxesPosStreamRequest {
    int32 group_no = 1;

    // The rate decides the response cycle. The unit is Hz and the max is 250 Hz.
