        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_GROUP_DOES_NOT_EXIST = 3;
    }
    Status status = 3;
}

message GetCartesianPosRequest {
    int32 group_no = 1;
    int32 tool_no = 2;
    PosType pos_type = 3; // `POS_TYPE_BASE`, `POS_TYPE_ROBOT` and `POS_TYPE_USER` are supported.
    optional int32 frame_aux_no = 4; // Required if the `pos_type` is `USER` or `TOOL`.
}

message GetCartesianPosResponse {
    Timestamp timestamp = 1;
    CartesianPos cartesian_pos = 2;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_GROUP_DOES_NOT_EXIST = 3;
        STATUS_GROUP_TYPE_NOT_SUPPORTED = 4;
        STATUS_TOOL_NO_OUTRANGE = 5;
        STATUS_POS_TYPE_UNKNOWN = 6;
        STATUS_POS_TYPE_UNSUPPORTED = 7;
        STATUS_FRAME_AUX_NO_MISSING = 8;
        STATUS_FRAME_AUX_NO_OUTRANGE = 9;
    }
    Status status = 3;
    int32 tool_no = 4;
}

message GetCartesianPosStreamRequest {
    int32 group_no = 1;
    int32 tool_no = 2;
    PosType pos_type = 3; // `POS_TYPE_BASE`, `POS_TYPE_ROBOT` and `POS_TYPE_USER` are supported.
