syntax = "proto3";

package rcs.v1;

import "rcs/v1/timestamp.proto";
import "rcs/v1/position_types.proto";

/**
 * `Variable` service provides a way to access variables in the robot controller.
 *
 * [ERRORS]
 * - See the status defined in each response message.
 */
service VariableService {
    // Get a `BYTE` variable in the robot controller.
    rpc GetByteVariable(GetByteVariableRequest) returns (GetByteVariableResponse);
    // Get a `BYTE` variable in the robot controller by streaming.
    rpc GetByteVariableStream(GetByteVariableStreamRequest) returns (stream GetByteVariableStreamResponse);
    // Get a `INTEGER` variable in the robot controller.
    rpc GetIntegerVariable(GetIntegerVariableRequest) returns (GetIntegerVariableResponse);
    // Get a `INTEGER` variable in the robot controller by streaming.
    rpc GetIntegerVariableStream(GetIntegerVariableStreamRequest) returns (stream GetIntegerVariableStreamResponse);
    // Get a `DOUBLE` variable in the robot controller.
    rpc GetDoubleVariable(GetDoubleVariableRequest) returns (GetDoubleVariableResponse);
    // Get a `DOUBLE` variable in the robot controller by streaming.
    rpc GetDoubleVariableStream(GetDoubleVariableStreamRequest) returns (stream GetDoubleVariableStreamResponse);
    // Get a `REAL` variable in the robot controller.
    rpc GetRealVariable(GetRealVariableRequest) returns (GetRealVariableResponse);
    // Get a `REAL` variable in the robot controller by streaming.
    rpc GetRealVariableStream(GetRealVariableStreamRequest) returns (stream GetRealVariableStreamResponse);
    // Get a `STRING` variable in the robot controller.
    rpc GetStringVariable(GetStringVariableRequest) returns (GetStringVariableResponse);
    // Get a `STRING` variable in the robot controller by streaming.
    rpc GetStringVariableStream(GetStringVariableStreamRequest) returns (stream GetStringVariableStreamResponse);
    // Get a `POSITION` (robot position) variable in the robot controller.
    rpc GetRobotPosVariable(GetRobotPosVariableRequest) returns (GetRobotPosVariableResponse);
    // Get a `POSITION` (robot position) variable in the robot controller by streaming.
    rpc GetRobotPosVariableStream(GetRobotPosVariableStreamRequest) returns (stream GetRobotPosVariableStreamResponse);
    // Get a `BP` (base position) variable in the robot controller.
    rpc GetBasePosVariable(GetBasePosVariableRequest) returns (GetBasePosVariableResponse);
    // Get a `BP` (base position) variable in the robot controller by streaming.
    rpc GetBasePosVariableStream(GetBasePosVariableStreamRequest) returns (stream GetBasePosVariableStreamResponse);
    // Get a `EX` (station position) variable in the robot controller.
    rpc GetStationPosVariable(GetStationPosVariableRequest) returns (GetStationPosVariableResponse);
    // Get a `EX` (station position) variable in the robot controller by streaming.
    rpc GetStationPosVariableStream(GetStationPosVariableStreamRequest) returns (stream GetStationPosVariableStreamResponse);
    // Get a variable by name in the robot controller.
    rpc GetVariableByName(GetVariableByNameRequest) returns (GetVariableByNameResponse);

    // Set a `BYTE` variable in the robot controller.
    rpc SetByteVariable(SetByteVariableRequest) returns (SetByteVariableResponse);
    // Set a `INTEGER` variable in the robot controller.
    rpc SetIntegerVariable(SetIntegerVariableRequest) returns (SetIntegerVariableResponse);
    // Set a `DOUBLE` variable in the robot controller.
    rpc SetDoubleVariable(SetDoubleVariableRequest) returns (SetDoubleVariableResponse);
    // Set a `REAL` variable in the robot controller.
    rpc SetRealVariable(SetRealVariableRequest) returns (SetRealVariableResponse);
    // Set a `STRING` variable in the robot controller.
    rpc SetStringVariable(SetStringVariableRequest) returns (SetStringVariableResponse);
    // Set a `POSITION` (robot position) variable in the robot controller.
    rpc SetRobotPosVariable(SetRobotPosVariableRequest) returns (SetRobotPosVariableResponse);
    // Set a `BP` (base position) variable in the robot controller.
    rpc SetBasePosVariable(SetBasePosVariableRequest) returns (SetBasePosVariableResponse);
    // Set a `EX` (station position) variable in the robot controller.
    rpc SetStationPosVariable(SetStationPosVariableRequest) returns (SetStationPosVariableResponse);
    // Set a variable by name in the robot controller.
    rpc SetVariableByName(SetVariableByNameRequest) returns (SetVariableByNameResponse);
}

message GetByteVariableRequest {
    int32 no = 1;
}

message GetByteVariableResponse {
    Timestamp timestamp = 1;

    uint32 value = 2;

    enum Status {
        STATUS_UNSPECIFIED= 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
    }
    Status status = 3;
}

message GetByteVariableStreamRequest {
    int32 no = 1;

    // The rate decides the response cycle. The unit is Hz and the max is 250 Hz.
    // The specified rate is rounded depending on the control period of the robot controller.
    float rate = 2;
}

message GetByteVariableStreamResponse {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
    }
    Status status = 1;

    Timestamp timestamp = 2;
    uint32 value = 3;
}

message GetIntegerVariableRequest {
    int32 no = 1;
}

message GetIntegerVariableResponse {
    Timestamp timestamp = 1;
    int32 value = 2;

    enum Status {
        STATUS_UNSPECIFIED= 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
    }
    Status status = 3;
}

message GetIntegerVariableStreamRequest {
    int32 no = 1;

    // The rate decides the response cycle. The unit is Hz and the max is 250 Hz.
    // The specified rate is rounded depending on the control period of the robot controller.
    float rate = 2;
}

message GetIntegerVariableStreamResponse {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
    }
    Status status = 1;

    Timestamp timestamp = 2;
    int32 value = 3;
}

message GetDoubleVariableRequest {
    int32 no = 1;
}

message GetDoubleVariableResponse {
    Timestamp timestamp = 1;

    int32 value = 2;

    enum Status {
        STATUS_UNSPECIFIED= 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
    }
    Status status = 3;
}

message GetDoubleVariableStreamRequest {
    int32 no = 1;

    // The rate decides the response cycle. The unit is Hz and the max is 250 Hz.
    // The specified rate is rounded depending on the control period of the robot controller.
    float rate = 2;
}

message GetDoubleVariableStreamResponse {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
    }
    Status status = 1;

    Timestamp timestamp = 2;
    int32 value = 3;
}

message GetRealVariableRequest {
    int32 no = 1;
}

message GetRealVariableResponse {
    Timestamp timestamp = 1;

    float value = 2;

    enum Status {
        STATUS_UNSPECIFIED= 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
    }
    Status status = 3;
}

message GetRealVariableStreamRequest {
    int32 no = 1;

    // The rate decides the response cycle. The unit is Hz and the max is 250 Hz.
    // The specified rate is rounded depending on the control period of the robot controller.
    float rate = 2;
}

message GetRealVariableStreamResponse {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
    }
    Status status = 1;

    Timestamp timestamp = 2;
    float value = 3;
}

message GetStringVariableRequest {
    int32 no = 1;
}

message GetStringVariableResponse {
    Timestamp timestamp = 1;

    string value = 2;

    enum Status {
        STATUS_UNSPECIFIED= 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
    }
    Status status = 3;
}

message GetStringVariableStreamRequest {
    int32 no = 1;

    // The rate decides the response cycle. The unit is Hz and the max is 250 Hz.
    // The specified rate is rounded depending on the control period of the robot controller.
    float rate = 2;
}

message GetStringVariableStreamResponse {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
