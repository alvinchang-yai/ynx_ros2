message GetRobotPosVariableRequest {
    int32 no = 1;
}

message GetRobotPosVariableResponse {
    Timestamp timestamp = 1;

    oneof pos {
        PulsePos pulse = 2;
        CartesianPos base = 4;
        CartesianPos robot = 5;
        CartesianPos user = 6;
        CartesianPos tool = 7;
    }

    // If `pos` is `user`, this member has the index of user frame.
    int32 frame_aux_no = 10;

    int32 tool_no = 11;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
        STATUS_NOT_INITIALIZED = 4; // Specified variable is not initialized.
    }
    Status status = 12;
}

message GetRobotPosVariableStreamRequest {
    int32 no = 1;

    // The rate decides the response cycle. The unit is Hz and the max is 250 Hz.
    // The specified rate is rounded depending on the control period of the robot controller.
    float rate = 2;
}

message GetRobotPosVariableStreamResponse {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
        STATUS_NOT_INITIALIZED = 4; // Specified variable is not initialized.
    }
    Status status = 1;

    Timestamp timestamp = 2;
    oneof pos {
        PulsePos pulse = 3;
        CartesianPos base = 5;
        CartesianPos robot = 6;
        CartesianPos user = 7;
        CartesianPos tool = 8;
    }

    // If `pos` is `user`, this member has the index of user frame.
    int32 frame_aux_no = 10;

    int32 tool_no = 11;
}

message GetBasePosVariableRequest {
    int32 no = 1;
}

message GetBasePosVariableResponse {
    Timestamp timestamp = 1;

    // The value for invalid axes which are not configured will always be set zero.
    // For example, when a base is configured as YZ(two axes) and the variable is BASE frame,
    // the value of X in the variable will always zero.
    // On the other hand, if the frame of the variable is PULSE, the value which is after the configured axes will be always zero. 
    // The available axes length in PULSE frame is the max axes number in all base groups.
    oneof pos {
        PulsePos pulse = 2;
        CartesianPos base = 4;
    }

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
        STATUS_NOT_INITIALIZED = 4; // Specified variable is not initialized.
    }
    Status status = 10;
}

message GetBasePosVariableStreamRequest {
    int32 no = 1;

    // The rate decides the response cycle. The unit is Hz and the max is 250 Hz.
    // The specified rate is rounded depending on the control period of the robot controller.
    float rate = 2;
}

message GetBasePosVariableStreamResponse {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
        STATUS_NOT_INITIALIZED = 4; // Specified variable is not initialized.
    }
    Status status = 1;

    Timestamp timestamp = 2;

    // The value for invalid axes which are not configured will always be set zero.
    // For example, when a base is configured as YZ(two axes) and the variable is BASE frame,
    // the value of X in the variable will always zero.
    // On the other hand, if the frame of the variable is PULSE, the value which is after the configured axes will be always zero. 
    // The available axes length in PULSE frame is the max axes number in all base groups.
    oneof pos {
        PulsePos pulse = 3;
        CartesianPos base = 5;
    }
}

message GetStationPosVariableRequest {
    int32 no = 1;
}

message GetStationPosVariableResponse {
    Timestamp timestamp = 1;

    // The value for invalid axes which are not configured will always be set zero.
    // For example, when a station have two axes, the value which is after the configured axes will be always zero.
    // The available axes length in PULSE frame is the max axes number in all station groups.
    oneof pos {
        PulsePos pulse = 2;
    }

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
        STATUS_NOT_INITIALIZED = 4; // Specified variable is not initialized.
    }
    Status status = 10;
}

message GetStationPosVariableStreamRequest {
    int32 no = 1;

    // The rate decides the response cycle. The unit is Hz and the max is 250 Hz.
    // The specified rate is rounded depending on the control period of the robot controller.
    float rate = 2;
}

message GetStationPosVariableStreamResponse {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
        STATUS_NOT_INITIALIZED = 4; // Specified variable is not initialized.
    }
    Status status = 1;

    Timestamp timestamp = 2;

    // The value for invalid axes which are not configured will always be set zero.
    // For example, when a station have two axes, the value which is after the configured axes will be always zero.
    // The available axes length in PULSE frame is the max axes number in all station groups.
    oneof pos {
        PulsePos pulse = 3;
    }
}

message GetVariableByNameRequest {
    string name = 1;
    int64 size = 2;
}

message GetVariableByNameResponse {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_SIZE_ERROR = 3;
        STATUS_VARIABLE_NOT_FOUND = 4;
    }
    Status status = 1;

    Timestamp timestamp = 2;

    bytes data = 3;
}

message SetByteVariableRequest {
    int32 no = 1;
    uint32 value = 2;
}

message SetByteVariableResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
    }
    Status status = 2;
}

message SetIntegerVariableRequest {
    int32 no = 1;
    int32 value = 2;
}

message SetIntegerVariableResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
    }
    Status status = 2;
}

message SetDoubleVariableRequest {
    int32 no = 1;
    int32 value = 2;
}

message SetDoubleVariableResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
    }
    Status status = 2;
}

message SetRealVariableRequest {
    int32 no = 1;
    float value = 2;
}

message SetRealVariableResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
    }
    Status status = 2;
}

message SetStringVariableRequest {
    int32 no = 1;
    string value = 2; // The max string length is 48 bytes.
}

message SetStringVariableResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
        STATUS_STRING_LENGTH_OVER = 4;
    }
    Status status = 2;
}

message SetRobotPosVariableRequest {
    int32 no = 1;

    oneof pos {
        PulsePos pulse = 2;
        CartesianPos base = 4;
        CartesianPos robot = 5;
        CartesianPos user = 6;
        CartesianPos tool = 7;
    }

     // Required if the `pos` requires additional information.
     // If the `pos` is `user`, the user frame index is expected.
    optional int32 frame_aux_no = 10;
    int32 tool_no = 11;
}

message SetRobotPosVariableResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
        STATUS_POS_TYPE_UNKNOWN = 4;
        STATUS_POS_TYPE_UNSUPPORTED = 5;
        STATUS_TOOL_NO_OUTRANGE = 6;
        STATUS_FRAME_AUX_NO_MISSING = 7;
        STATUS_FRAME_AUX_NO_OUTRANGE = 8;
    }
    Status status = 2;
}

message SetBasePosVariableRequest {
    int32 no = 1;

    // If set the value for not configured axes, the value will be ignored.
    // The valid axes is united axes in all base groups.
    // ex.) B1 = (1, 0, 0), B2 = (1, 1, 0) => (1, 1, 0) is valid.
    oneof pos {
        PulsePos pulse = 2;
        CartesianPos base = 4;
    }
}

message SetBasePosVariableResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
        STATUS_POS_TYPE_UNKNOWN = 4;
        STATUS_POS_TYPE_UNSUPPORTED = 5;
    }
    Status status = 2;
}

message SetStationPosVariableRequest {
    int32 no = 1;

    // If set the value for not configured axes, the value will be ignored.
    // The valid axes is united axes in all base groups.
    oneof pos {
        PulsePos pulse = 2;
    }
}

message SetStationPosVariableResponse {
    Timestamp timestamp = 1;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_NO_OUTRANGE = 3;
        STATUS_POS_TYPE_UNKNOWN = 4;
        STATUS_POS_TYPE_UNSUPPORTED = 5;
    }
    Status status = 2;
}

message SetVariableByNameRequest {
    string name = 1;
    bytes data = 2;
}

message SetVariableByNameResponse {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNKNOWN_ERROR = 2;
        STATUS_SIZE_ERROR = 3;
        STATUS_VARIABLE_NOT_FOUND = 4;
        STATUS_POS_TYPE_UNSUPPORTED = 5;
        STATUS_TOOL_NO_OUTRANGE = 6;
        STATUS_FRAME_AUX_NO_OUTRANGE = 7;
    }
    Status status = 1;

    Timestamp timestamp = 2;
}
